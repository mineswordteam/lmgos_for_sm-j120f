name: Build LMG Launcher
on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle.kts', '.github/workflows/build-launcher.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LMG-Launcher-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LMG-Launcher.apk
          gh release create "launcher-${{ github.run_number }}" LMG-Launcher.apk --title "LMG Launcher build ${{ github.run_number }}" --notes "Automatic build of ${{ github.sha }}" --prerelease
